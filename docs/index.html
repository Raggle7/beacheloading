<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-layer" id="bg-a"></div>
  <div class="bg-layer" id="bg-b"></div>
  <div class="shade"></div>

  <div class="tip is-hidden" id="tip">
    <span class="tip-label">Tip</span>
    <span id="tip-text"></span>
  </div>

  <div class="now-playing is-hidden" id="now-playing">
    <svg class="note" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
    <span id="track-title"></span>
  </div>

  <div class="info">
    <img class="logo" id="logo" alt="" hidden>
    <h1 class="server-name" id="server-name"></h1>
    <p class="map-name" id="map-name"></p>
    <div class="progress is-hidden" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
    <p class="status-line"><span id="status">Connecting</span><span class="file-count" id="file-count"></span></p>
    <p class="file-name" id="file-name"></p>
  </div>

  <div class="loader">
    <div class="spinner" id="spinner"></div>
    <img class="loader-image" id="loader-image" alt="" hidden>
    <p class="loader-caption" id="loader-caption"><span id="loader-text"></span><span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
  </div>

  <div class="preview-badge">Preview<span class="gesture-hint"> &middot; click anywhere to start the music</span></div>

  <script src="config.js"></script>
  <script src="loading.js"></script>
</body>
</html>
