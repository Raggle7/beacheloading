<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="glow" cx="50%" cy="20%" r="85%">
      <stop offset="0" stop-color="#1d3f74"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity="0.04" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#fff" text-anchor="middle">
    <text x="960" y="520" font-size="44" font-weight="700" fill-opacity="0.2" letter-spacing="8">PLACEHOLDER BACKGROUND 3</text>
    <text x="960" y="580" font-size="26" fill-opacity="0.16">Replace with your own 1920×1080 image in docs/img/bg/</text>
  </g>
</svg>
